<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Doctor Portal | Hospital System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: Arial, sans-serif; }
        .hero-section { background: #00458b; color: white; padding: 40px 0; margin-bottom: 30px; }
        .hero-actions { margin-top: 20px; display: flex; justify-content: center; gap: 12px; }
        .card { border: none; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: transform 0.2s; }
        .card:hover { transform: translateY(-5px); }
        .btn-primary { background-color: #00458b; border: none; }
        .btn-primary:hover { background-color: #003570; }
        .available { color: darkgreen; font-weight: bold; }
        .unavailable { color: crimson; font-weight: bold; }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    </style>
</head>
<body>

    <header class="hero-section text-center">
        <div class="container">
            <h1 th:text="'Welcome, Dr.' + ${doctor.name} + '!'">Welcome, Dr. [Name]!</h1>
            <p class="lead">You are now logged in to your doctor dashboard.</p>
            <div class="hero-actions">
                <a th:href="@{/profile/edit}" class="btn btn-outline-light">&#9881; Edit Profile</a>
                <form th:action="@{/logout}" method="post" style="margin:0;">
                    <button type="submit" class="btn btn-light text-danger fw-bold">&#8594; Log Out</button>
                </form>
            </div>
        </div>
    </header>

    <main class="container">

        <!-- Occupancy Card -->
        <div class="card p-4 mb-4 text-center">
            <h4 class="mb-3">Hospital Occupancy</h4>
            <p class="mb-1">
                Current Occupancy:
                <strong class="text-primary" th:text="${occupancy.occupancy}"></strong>
                /
                <strong class="text-primary" th:text="${occupancy.capacity}"></strong>
            </p>
            <p class="text-muted" th:text="'Available Space: ' + ${occupancy.availableSpace}"></p>
        </div>

        <div class="row g-4">

            <!-- My Info -->
            <div class="col-md-6">
                <div class="card h-100 p-4">
                    <div class="section-header">
                        <h5 class="mb-0">My Info</h5>
                    </div>
                    <p class="mb-1" th:text="'Name: Dr.' + ${doctor.name}"></p>
                    <p class="mb-1" th:text="'Email: ' + ${profile.email}"></p>
                    <p class="mb-1" th:text="'Username: ' + ${profile.username}"></p>
                    <p class="mb-1" th:text="'Department: ' + ${department.name}"></p>
                </div>
            </div>

            <!-- My Schedule -->
            <div class="col-md-6">
                <div class="card h-100 p-4">
                    <div class="section-header">
                        <h5 class="mb-0">My Schedule</h5>
                        <a th:href="@{/doctor/editSchedule}" class="btn btn-primary btn-sm">Edit Schedule</a>
                    </div>
                    <div class="slots-container">
                        <th:block th:each="timeslot : ${timeSlots}">
                            <p class="mb-1" th:if="${timeslot.appointment != null && timeslot.appointment.patient != null}">
                                <span th:text="${timeslot.date} + ': ' + ${timeslot.startTime} + ' to ' + ${timeslot.endTime}"></span>
                                <span class="unavailable ms-2" 
                                    th:text="'Appointment with ' + ${timeslot.appointment.patient.firstName} + ' ' + ${timeslot.appointment.patient.lastName}">
                                </span>
                            </p>
                        </th:block>
                    </div>
                </div>
            </div>

        </div>
    </main>

</body>
</html>
