<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Doctor Home</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #eef6ff;
        }

        .navbar {
            background: #2f6fd6;
            padding: 15px 25px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h2 {
            margin: 0;
        }

        .logout-btn {
            background: white;
            color: #2f6fd6;
            padding: 8px 14px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        .logout-btn:hover {
            background: #e6e6e6;
        }

        .content {
            padding: 40px;
            text-align: center;
        }

        .content h3 {
            color: #333;
        }

        .split-container{
            display: flex;
            flex-direction: row;
            height: calc(100vh - 60px);
        }

        .left-panel{
            width: 50%;
            padding: 40px;
            background: #eef6ff;
            border-right: 5px solid #00050b;
            border-top: 5px solid #00050b;
        }

        .right-panel{
            width: 50%;
            padding: 40px;
            background: #eef6ff;
            border-top: 5px solid #00050b;
        }

        .panel-header{
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        }

        .panel-header h3{
            margin: 0px;
        }

        .editProfile-btn{
            background: #2f6fd6;
            color: white;
            padding: 8px 14px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            text-decoration: none;
        }

        .editProfile-btn:hover{
            background: #2b65c2;
        }

        .editSchedule-btn{
            background: #2f6fd6;
            color: white;
            padding: 8px 14px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        .editSchedule-btn:hover{
            background: #2b65c2;
        }

        .available{
            color:darkgreen;
            font-weight: bold;
        }

        .unavailable{
            color:crimson;
            font-weight: bold;
        }

    </style>
</head>

<body>

<div class="navbar">
    <h2>Doctor Portal</h2>

    <form th:action="@{/logout}" method="post">
        <button class="logout-btn" type="submit">Logout</button>
    </form>
</div>
 
<div class="content">
    <h3 th:text= "'Welcome, Dr.' + ${doctor.name} + '!'"></h3>
    <p>You are now logged in to your doctor dashboard.</p>
</div>

<div class="split-container">
    <div class="left-panel">
        <div class="panel-header">
            <h3> My Info </h3>
            <a th:href="@{/profile/edit}" class="editProfile-btn">Edit Profile</a>
        </div>
        <p th:text="'Name: Dr.' + ${doctor.name}"></p>
        <p th:text="'Email: ' + ${profile.email}"></p>
        <p th:text="'Username: ' + ${profile.username}"></p>
        <p th:text="'Department: ' + ${department.name}"></p>
    </div>
    <div class="right-panel">
        <div class="panel-header">
            <h3> My Schedule </h3>
            <button class="editSchedule-btn" type="submit">Edit Schedule</button>
        </div>
        <div th:each= "timeslot: ${timeSlots}">
            <p>
                <span th:text="${timeslot.date} + ': ' + ${timeslot.startTime} + ' to ' + ${timeslot.endTime} "></span>
                <span th:text="${timeslot.available} ? 'Available' : 'Unavailable'"
                    th:class="${timeslot.available} ? 'available' : 'unavailable'"></span>
            </p>
        </div>
    </div>
</div>


</body>
</html>
